name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, pdo_mysql, gd, zip, bcmath, fileinfo, sodium
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Versione del tag = file VERSION
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - run: bash scripts/build-release.sh dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
