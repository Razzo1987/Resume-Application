name: Release

# A "vX.Y.Z" tag publishes the package of that version, in four steps:
#   verify  - the tag matches VERSION, is signed with the maintainer's GPG key and points to a commit on main;
#   tests   - the same checks as the CI (secrets, dependencies, workflows, PHP, end-to-end);
#   build   - the package, with read-only permissions;
#   publish - provenance attestation, then the release: created as a draft with all its files and published only at
#             the end (with immutable releases a published release can no longer change).
# A failed run leaves at most a draft: delete the tag on GitHub and push it again.

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Primary key of the maintainer (public key in .github/maintainer-key.asc)
  RELEASE_GPG_FINGERPRINT: 006777268F4C6526B60D3962F3FA87355DFF9D37

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # main is needed to check where the tag points
          persist-credentials: false
      - name: Tag version = VERSION file
        env:
          TAG: ${{ github.ref_name }}
        run: test "v$(tr -d '[:space:]' < VERSION)" = "$TAG"
      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::The tag does not point to a commit of main"; exit 1; }
      - name: Tag signed by the maintainer
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The checkout may keep only the commit: fetch the annotated tag object itself
          git fetch --no-tags --force origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          test "$(git cat-file -t "$TAG")" = tag \
            || { echo "::error::${TAG} is not an annotated (signed) tag"; exit 1; }
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          gpg --batch --quiet --import .github/maintainer-key.asc
          git verify-tag --raw "$TAG" 2>&1 | grep -qE "^\[GNUPG:\] VALIDSIG .* ${RELEASE_GPG_FINGERPRINT}\$" \
            || { echo "::error::${TAG} is not signed with the key ${RELEASE_GPG_FINGERPRINT}"; exit 1; }
          echo "${TAG} signed by ${RELEASE_GPG_FINGERPRINT}"

  tests:
    name: Tests
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] same commit as the tag
    secrets:
      PRIVACY_PATTERNS: ${{ secrets.PRIVACY_PATTERNS }}

  build:
    name: Package
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: intl, mbstring, pdo_mysql, gd, zip, bcmath, fileinfo, sodium
          coverage: none
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false # never reuse a cache in a release build
      - run: bash scripts/build-release.sh dist
      # Release notes: the version entry in the CHANGELOG (the admin also shows them when it announces the update)
      - name: Notes from the CHANGELOG
        run: |
          awk -v version="$(cat VERSION)" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > dist/RELEASE_NOTES.md
          test -s dist/RELEASE_NOTES.md
          printf '\n---\nSHA-256 of the package: `%s`\n' "$(cut -d' ' -f1 dist/*.zip.sha256)" >> dist/RELEASE_NOTES.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Settings → Environments → release: deployments only from tags "v*"
    environment: release
    permissions:
      contents: write     # the release
      id-token: write     # provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Provenance attestation of the package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Release (draft first, published when complete)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # A draft left by a failed run is replaced; a published release is never touched
          if draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != true ]; then
              echo "::error::The release ${TAG} is already published"
              exit 1
            fi
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" --draft --verify-tag \
            --title "Resume App ${TAG}" --notes-file dist/RELEASE_NOTES.md \
            dist/*.zip dist/*.sha256
          gh release edit "$TAG" --draft=false --latest
